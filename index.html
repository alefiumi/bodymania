<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BodyMania – impara l'anatomia giocando</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1f2a30;--mut:#6b7780;--acc:#0f766e;--ok:#16a34a;--bad:#dc2626;--edge:#8a8272;--line:#e3ded2}
@media(prefers-color-scheme:dark){:root{--bg:#12181b;--card:#1b2428;--ink:#e8eef0;--mut:#93a1a8;--acc:#2dd4bf;--edge:#3b4a50;--line:#2a363b}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100vh;height:100svh;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--card);border-bottom:1px solid var(--line)}
#lv{font-weight:700;font-size:13px;white-space:nowrap}
.bar{flex:1;height:8px;background:var(--line);border-radius:9px;overflow:hidden;min-width:30px}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .4s}
#st{font-size:13px;font-weight:600;white-space:nowrap}
#fig{flex:1 1 0;min-height:0;display:flex;justify-content:center;padding:4px;position:relative}
#fig svg{height:100%;max-width:100%;touch-action:none}
#panel{flex:0 0 auto;max-height:46vh;overflow:auto;background:var(--card);border-top:1px solid var(--line);padding:12px 14px}
nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:12px 0;border:0;background:none;color:var(--mut);font-size:14px;font-weight:600}
nav button.on{color:var(--acc);box-shadow:inset 0 2px 0 var(--acc)}
.bone{cursor:pointer;--c:var(--b,#d9d2c3)}
.bone.m1{--c:#a5dccf}.bone.m2{--c:#4fbfae}.bone.m3{--c:#f0c75e}
.bone .f{fill:var(--c);stroke:var(--edge);stroke-width:1;transition:fill .2s}
.bone .l{stroke:var(--c);fill:none;stroke-linecap:round;transition:stroke .2s}
.bone .hit{stroke:transparent;fill:none;stroke-linecap:round}
.bone .hitf{fill:transparent;stroke:none}
.bone.sel{--c:#7dd3fc}.bone.org{--c:#60a5fa}.bone.ins{--c:#fb923c}.bone.ok{--c:#4ade80}.bone.bad{--c:#f87171}
.bone.sel .f,.bone.org .f,.bone.ins .f,.bone.ok .f,.bone.bad .f{stroke:#111;stroke-width:1.6}
.bone.ghost{opacity:.3;--c:#9aa5aa}
.bone.ghost.bad{opacity:1;--c:#f87171}
.hole{fill:var(--bg);pointer-events:none}
.tray{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.pc{width:76px;padding:6px;border:2px solid var(--line);border-radius:12px;background:var(--bg);text-align:center;font-size:11px;line-height:1.2;touch-action:none;user-select:none;-webkit-user-select:none}
.pc svg{width:48px;height:48px;display:block;margin:0 auto 3px}
.pc.on{border-color:var(--acc);background:var(--card)}
#flt{position:fixed;z-index:9;pointer-events:none;width:56px;height:56px;opacity:.92}
.fb{font-size:14px;min-height:20px;margin:4px 0}
.clue{background:var(--bg);border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:14px}
.bone.hov{--c:#38bdf8}.bone.hov .f{stroke:#0284c7;stroke-width:2.4}.bone.ghost.hov{opacity:1}
.mods{position:absolute;top:6px;left:6px;display:flex;gap:4px;z-index:3;flex-wrap:wrap;max-width:62%}
.mods button{font-size:12px;font-weight:600;padding:5px 9px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.mods button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.zc{position:absolute;right:6px;bottom:6px;display:flex;flex-direction:column;gap:6px;z-index:3}
.zc button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;font-weight:700;box-shadow:0 1px 4px #0003}
.tg{display:inline-block;color:#fff;border-radius:6px;padding:1px 6px;font-size:11px;font-weight:700}
.tg.o{background:#2563eb}.tg.i{background:#ea580c}
.sol div{margin:5px 0}
.h{font-size:18px;font-weight:700}.h i,.q i{font-weight:400;color:var(--mut);font-size:14px}
.mut{color:var(--mut);font-size:13px}
.tip{background:var(--bg);border-radius:10px;padding:8px 10px;font-size:14px}
.sub{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin:10px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
button.mc,button.opt,button.btn,button.mode{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 12px;text-align:left}
button.mc small{color:var(--mut)}
button.mode{display:block;width:100%;margin-bottom:8px;padding:12px}
button.mode small{display:block;color:var(--mut)}
button.opt{display:block;width:100%;margin-bottom:8px;font-size:16px;padding:12px}
button.btn,button.next{background:var(--acc);color:#fff;border:0;font-weight:700;text-align:center;margin-top:8px;margin-right:6px;padding:11px 16px;border-radius:12px;font-size:15px}
button.btn.alt{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.gh{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.q{font-size:18px;margin-bottom:10px}.q small{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.md{margin-top:10px;font-size:14px;border-left:3px solid #7c3aed;padding-left:10px}
.res{text-align:center}.big{font-size:32px}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.dots{letter-spacing:2px;color:#f0c75e}
.leg{font-size:12px;color:var(--mut);margin-top:8px}
</style>
</head>
<body>
<header><span id="lv"></span><div class="bar"><i id="xpb"></i></div><span id="st"></span></header>
<div id="fig"></div>
<div id="panel"></div>
<nav>
<button data-t="explore" class="on">🦴 Esplora</button>
<button data-t="play">🎮 Gioca</button>
<button data-t="prog">📈 Progressi</button>
</nav>
<script>
"use strict";
const $=id=>document.getElementById(id);
const ln=(x1,y1,x2,y2,w)=>`<line class="l" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke-width="${w}"/><line class="hit" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke-width="${w+14}"/>`;
const pth=(d,w)=>`<path class="l" d="${d}" stroke-width="${w}"/><path class="hit" d="${d}" stroke-width="${w+12}"/>`;
const ell=(cx,cy,rx,ry)=>`<ellipse class="f" cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}"/><ellipse class="hitf" cx="${cx}" cy="${cy}" rx="${rx+6}" ry="${ry+6}"/>`;
const poly=d=>`<path class="f" d="${d}"/>`;
const stack=(x,y,w,h,n)=>{let s='';const g=1.2,hh=(h-g*(n-1))/n;for(let i=0;i<n;i++)s+=`<rect class="f" x="${x}" y="${(y+i*(hh+g)).toFixed(1)}" width="${w}" height="${hh.toFixed(1)}" rx="2"/>`;return s;};
const fingers=(a)=>a.map(f=>ln(f[0],f[1],f[2],f[3],4)).join('');
let ribs='';for(let i=0;i<8;i++){const y0=116+i*10;ribs+=pth(`M158 ${y0} Q ${204-i*2} ${y0+2} ${196-i*3} ${y0+24}`,3.5);}

/* Ordine = ordine di disegno (z-order). Coordinate del lato destro dello schermo; le ossa pari vengono specchiate. */
const BODY_B=[
{id:'bacino',n:'Bacino (ossa coxali)',l:'Ossa coxae',r:'Bacino',c:[176,278],pair:0,
 s:poly('M106 252 Q100 270 118 292 L138 300 L150 318 L162 300 L182 292 Q200 270 194 252 Q172 246 150 254 Q128 246 106 252Z')+'<ellipse class="hole" cx="132" cy="302" rx="5" ry="8"/><ellipse class="hole" cx="168" cy="302" rx="5" ry="8"/>',
 f:"Anello osseo formato da ileo, ischio e pube (con il sacro). Trasmette il peso del tronco agli arti inferiori e ospita l'acetabolo per la testa del femore.",
 k:"Le spine iliache (SIAS, SIAI) e la tuberosità ischiatica sono repere palpabili e punti di origine di molti muscoli di anca e coscia."},
{id:'sacro',n:'Sacro e coccige',l:'Os sacrum, Os coccygis',r:'Colonna',c:[150,272],pair:0,
 s:poly('M138 250 L162 250 L156 288 L150 296 L144 288Z'),
 f:"Cinque vertebre sacrali fuse formano il sacro, che si articola con l'ileo nelle articolazioni sacroiliache. Sotto si trova il coccige.",
 k:"Le articolazioni sacroiliache sono poco mobili e possono essere fonte di dolore lombo-pelvico."},
{id:'lombari',n:'Vertebre lombari',l:'Vertebrae lumbales (L1–L5)',r:'Colonna',c:[150,226],pair:0,
 s:stack(140,204,20,44,5),
 f:"Cinque vertebre massicce che sostengono il carico del tronco e permettono flessione, estensione e inclinazione laterale.",
 k:"I livelli L4–L5 e L5–S1 sono quelli più spesso coinvolti nelle ernie discali."},
{id:'toraciche',n:'Vertebre toraciche',l:'Vertebrae thoracicae (T1–T12)',r:'Colonna',c:[150,158],pair:0,
 s:stack(142,112,16,90,12),
 f:"Dodici vertebre che si articolano con le costole. La gabbia toracica limita la mobilità in flessione ed estensione.",
 k:"Gran parte della rotazione del tronco avviene nel tratto toracico."},
{id:'cervicali',n:'Vertebre cervicali',l:'Vertebrae cervicales (C1–C7)',r:'Collo',c:[150,98],pair:0,
 s:stack(144,86,12,24,7),
 f:"Sette vertebre. C1 (atlante) e C2 (epistrofeo) sono specializzate: permettono i movimenti di assenso e di rotazione del capo.",
 k:"Circa metà della rotazione cervicale avviene tra C1 e C2."},
{id:'sterno',n:'Sterno',l:'Sternum',r:'Torace',c:[150,142],pair:0,
 s:poly('M143 112 L157 112 L155 128 L156 168 L150 176 L144 168 L145 128Z'),
 f:"Osso piatto mediano formato da manubrio, corpo e processo xifoideo. Ancora le cartilagini costali.",
 k:"L'angolo sternale (giunzione manubrio-corpo) è un repere per la seconda costola."},
{id:'costole',n:'Costole',l:'Costae',r:'Torace',c:[184,150],pair:1,
 s:ribs,
 f:"Dodici paia: 7 vere, 3 false e 2 fluttuanti. Proteggono gli organi toracici e si muovono con il respiro.",
 k:"Le costole inferiori si muovono a 'manico di secchio', le superiori a 'braccio di pompa'."},
{id:'scapola',n:'Scapola',l:'Scapula',r:'Spalla',c:[219,125],pair:1,
 s:poly('M206 100 L232 104 L230 124 L218 152 L208 128Z'),
 f:"Osso piatto triangolare posteriore. Acromion, processo coracoideo e cavità glenoidea formano l'articolazione gleno-omerale.",
 k:"Il ritmo scapolo-omerale (circa 2:1) è fondamentale per l'elevazione del braccio."},
{id:'clavicola',n:'Clavicola',l:'Clavicula',r:'Spalla',c:[190,104],pair:1,
 s:pth('M153 101 Q190 112 230 98',5),
 f:"Osso a S che collega lo sterno all'acromion. È l'unico collegamento osseo tra arto superiore e scheletro assiale.",
 k:"Le fratture sono frequenti dopo cadute sulla spalla, tipicamente nel terzo medio."},
{id:'omero',n:'Omero',l:'Humerus',r:'Braccio',c:[246,166],pair:1,
 s:'<circle class="f" cx="239" cy="114" r="8"/>'+ln(241,120,252,214,9),
 f:"Osso del braccio: testa, tubercoli maggiore e minore, diafisi, epicondili, troclea e capitello.",
 k:"Il collo chirurgico è a rischio per il nervo ascellare, la diafisi per il nervo radiale (solco del radiale)."},
{id:'radio',n:'Radio',l:'Radius',r:'Avambraccio',c:[266,262],pair:1,
 s:ln(258,220,272,306,6),
 f:"Osso laterale (lato pollice) dell'avambraccio. Ruota attorno all'ulna nella prono-supinazione.",
 k:"La frattura dell'estremità distale (di Colles) è comune dopo una caduta sulla mano aperta."},
{id:'ulna',n:'Ulna',l:'Ulna',r:'Avambraccio',c:[253,266],pair:1,
 s:ln(250,218,256,312,6),
 f:"Osso mediale dell'avambraccio. L'olecrano forma la punta del gomito e si articola con la troclea omerale.",
 k:"Stabilizza il gomito nella flesso-estensione, mentre il radio ruota attorno a essa."},
{id:'carpo',n:'Ossa del carpo',l:'Ossa carpi',r:'Mano',c:[264,320],pair:1,
 s:ell(264,320,11,7),
 f:"Otto ossa in due file: scafoide, semilunare, piramidale, pisiforme e trapezio, trapezoide, capitato, uncinato.",
 k:"Lo scafoide è l'osso del carpo più spesso fratturato, con rischio di necrosi avascolare."},
{id:'metacarpo',n:'Metacarpo e falangi (mano)',l:'Ossa metacarpalia, Phalanges',r:'Mano',c:[268,348],pair:1,
 s:fingers([[258,330,255,366],[263,330,262,372],[268,330,269,370],[273,330,276,362],[274,324,286,346]]),
 f:"Cinque metacarpi e 14 falangi: due nel pollice, tre in ciascuna delle altre dita.",
 k:"La 'frattura del boxer' interessa tipicamente il collo del quinto metacarpo."},
{id:'cranio',n:'Cranio',l:'Cranium',r:'Testa',c:[150,36],pair:0,
 s:ell(150,36,27,29),
 f:"Protegge l'encefalo e ospita gli organi di senso. È formato da neurocranio e splancnocranio.",
 k:"L'articolazione atlanto-occipitale permette l'annuire del capo."},
{id:'mandibola',n:'Mandibola',l:'Mandibula',r:'Testa',c:[150,72],pair:0,
 s:poly('M128 58 L132 76 Q150 90 168 76 L172 58 Q150 74 128 58Z'),
 f:"Unico osso mobile del cranio. Si articola con l'osso temporale nell'articolazione temporo-mandibolare (ATM).",
 k:"Le disfunzioni dell'ATM vengono trattate anche dal fisioterapista."},
{id:'femore',n:'Femore',l:'Femur',r:'Coscia',c:[170,372],pair:1,
 s:'<circle class="f" cx="174" cy="304" r="9"/>'+ln(172,312,166,438,11),
 f:"Osso più lungo e robusto del corpo: testa, collo, grande e piccolo trocantere, condili.",
 k:"La frattura del collo femorale è tipica dell'anziano e richiede spesso riabilitazione post-chirurgica."},
{id:'rotula',n:'Rotula',l:'Patella',r:'Ginocchio',c:[165,449],pair:1,
 s:ell(165,449,7,8),
 f:"Osso sesamoide più grande del corpo, incluso nel tendine del quadricipite. Aumenta il braccio di leva dell'estensione del ginocchio.",
 k:"Nella sindrome femoro-rotulea la rotula scorre in modo anomalo nella troclea femorale."},
{id:'tibia',n:'Tibia',l:'Tibia',r:'Gamba',c:[165,520],pair:1,
 s:ln(158,462,174,462,8)+ln(166,462,164,582,8),
 f:"Osso mediale e portante della gamba: plateau tibiale, tuberosità tibiale, malleolo mediale.",
 k:"La cresta tibiale è subcutanea e palpabile. Sulla tuberosità si inserisce il legamento patellare."},
{id:'fibula',n:'Fibula',l:'Fibula',r:'Gamba',c:[178,520],pair:1,
 s:ln(178,468,179,574,4),
 f:"Osso laterale e sottile della gamba: sostiene poco peso, dà origine a molti muscoli e forma il malleolo laterale.",
 k:"Il nervo peroneo comune passa attorno al collo della fibula ed è vulnerabile alla compressione."},
{id:'tarso',n:'Ossa del tarso',l:'Ossa tarsi',r:'Piede',c:[168,592],pair:1,
 s:ell(168,592,11,8),
 f:"Sette ossa: talo, calcagno, navicolare, cuboide e tre cuneiformi. Il talo trasmette il peso dalla tibia al piede.",
 k:"Il calcagno riceve il tendine d'Achille, il più robusto tendine del corpo."},
{id:'metatarso',n:'Metatarso e falangi (piede)',l:'Ossa metatarsalia, Phalanges',r:'Piede',c:[168,614],pair:1,
 s:fingers([[160,602,157,630],[164,602,163,632],[168,602,169,631],[172,602,175,628],[176,602,180,624]]),
 f:"Cinque metatarsi e 14 falangi: due nell'alluce, tre nelle altre dita. Formano gli archi del piede.",
 k:"Le fratture da stress interessano spesso il secondo e il terzo metatarso."}
];
let MOD,B,M,CASES,VB={x:0,y:0,w:300,h:640};
const bone=id=>B.find(b=>b.id===id);

/* Muscoli: o/i = osso di origine/inserzione principale; oa/ia = altri ossi validi (esclusi dai distrattori del quiz) */
const BODY_M=[
{id:'delt',n:'Deltoide',o:'scapola',ot:"acromion e spina della scapola (anche terzo laterale della clavicola)",oa:['clavicola'],i:'omero',it:"tuberosità deltoidea",a:"abduzione della spalla; le fibre anteriori flettono, le posteriori estendono"},
{id:'sovra',n:'Sovraspinato',o:'scapola',ot:"fossa sovraspinata",i:'omero',it:"tubercolo maggiore (faccetta superiore)",a:"avvia l'abduzione e centra la testa omerale (cuffia dei rotatori)"},
{id:'sotto',n:'Sottospinato',o:'scapola',ot:"fossa infraspinata",i:'omero',it:"tubercolo maggiore (faccetta media)",a:"extrarotazione della spalla (cuffia dei rotatori)"},
{id:'sscap',n:'Sottoscapolare',o:'scapola',ot:"fossa sottoscapolare",i:'omero',it:"tubercolo minore",a:"intrarotazione della spalla (cuffia dei rotatori)"},
{id:'gpett',n:'Grande pettorale',o:'clavicola',ot:"metà mediale della clavicola, sterno e cartilagini costali",oa:['sterno','costole'],i:'omero',it:"labbro laterale del solco intertubercolare",a:"adduzione e intrarotazione della spalla"},
{id:'bic',n:'Bicipite brachiale',o:'scapola',ot:"tubercolo sopraglenoideo (capo lungo) e processo coracoideo (capo breve)",i:'radio',it:"tuberosità radiale",a:"flessione del gomito e supinazione dell'avambraccio"},
{id:'tric',n:'Tricipite brachiale',o:'scapola',ot:"tubercolo infraglenoideo (capo lungo); i capi laterale e mediale originano dall'omero",oa:['omero'],i:'ulna',it:"olecrano",a:"estensione del gomito"},
{id:'brac',n:'Brachiale',o:'omero',ot:"metà distale della faccia anteriore",i:'ulna',it:"tuberosità ulnare e processo coronoideo",a:"flessione del gomito"},
{id:'pron',n:'Pronatore rotondo',o:'omero',ot:"epicondilo mediale (e processo coronoideo dell'ulna)",oa:['ulna'],i:'radio',it:"terzo medio della faccia laterale",a:"pronazione dell'avambraccio, flessione del gomito"},
{id:'fucar',n:'Flessore ulnare del carpo',o:'omero',ot:"epicondilo mediale (e olecrano/ulna)",oa:['ulna'],i:'carpo',it:"pisiforme (poi uncinato e base del 5° metacarpale)",ia:['metacarpo'],a:"flessione e deviazione ulnare del polso"},
{id:'erlc',n:'Estensore radiale lungo del carpo',o:'omero',ot:"cresta sopracondiloidea laterale",i:'metacarpo',it:"base del 2° metacarpale",a:"estensione e deviazione radiale del polso"},
{id:'trap',n:'Trapezio (fibre superiori)',o:'cranio',ot:"protuberanza occipitale esterna, linea nucale superiore e legamento nucale",oa:['cervicali'],i:'clavicola',it:"terzo laterale della clavicola",a:"elevazione della scapola, estensione e inclinazione del capo"},
{id:'scm',n:'Sternocleidomastoideo',o:'sterno',ot:"manubrio sternale (capo sternale) e clavicola (capo clavicolare)",oa:['clavicola'],i:'cranio',it:"processo mastoideo e linea nucale superiore",a:"inclinazione omolaterale e rotazione controlaterale del capo"},
{id:'mass',n:'Massetere',o:'cranio',ot:"arco zigomatico",i:'mandibola',it:"angolo e faccia laterale del ramo mandibolare",a:"chiusura della bocca (elevazione della mandibola)"},
{id:'psoas',n:'Psoas maggiore',o:'lombari',ot:"corpi e processi trasversi da T12 a L5",oa:['toraciche'],i:'femore',it:"piccolo trocantere (insieme all'iliaco: ileopsoas)",a:"flessione dell'anca"},
{id:'gmax',n:'Gluteo massimo',o:'bacino',ot:"ala iliaca posteriore",oa:['sacro'],i:'femore',it:"tuberosità glutea e tratto ileotibiale",a:"estensione ed extrarotazione dell'anca"},
{id:'gmed',n:'Gluteo medio',o:'bacino',ot:"faccia esterna dell'ala iliaca",i:'femore',it:"grande trocantere",a:"abduzione dell'anca; stabilizza il bacino nell'appoggio monopodalico"},
{id:'sart',n:'Sartorio',o:'bacino',ot:"spina iliaca anterosuperiore (SIAS)",i:'tibia',it:"faccia mediale prossimale (zampa d'oca)",a:"flessione di anca e ginocchio, extrarotazione dell'anca"},
{id:'rf',n:'Retto femorale',o:'bacino',ot:"spina iliaca anteroinferiore (SIAI)",i:'rotula',it:"base della rotula, poi tibia tramite legamento patellare",ia:['tibia'],a:"flessione dell'anca ed estensione del ginocchio"},
{id:'vasti',n:'Vasti del quadricipite',o:'femore',ot:"diafisi femorale (vasti laterale, mediale e intermedio)",i:'rotula',it:"rotula tramite tendine quadricipitale, poi tuberosità tibiale",ia:['tibia'],a:"estensione del ginocchio"},
{id:'addl',n:'Adduttore lungo',o:'bacino',ot:"corpo del pube",i:'femore',it:"linea aspra",a:"adduzione dell'anca"},

function setVB(t,anim){

 (function f(n){if(id!==tw)return;const k=Math.min(1,(n-t0)/260),e=k*(2-k);
  VB={x:s0.x+(t.x-s0.x)*e,y:s0.y+(t.y-s0.y)*e,w:s0.w+(t.w-s0.w)*e,h:s0.h+(t.h-s0.h)*e};applyVB();if(k<1)requestAnimationFrame(f);})(t0);
}

function focusPts(pts,pad){
 const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys),asp=MOD.H/MOD.W;
 let w=Math.max(x1-x0+2*pad,(y1-y0+2*pad)/asp,MOD.W/5);w=Math.min(w,MOD.W);const h=w*asp;
 setVB({x:(x0+x1)/2-w/2,y:(y0+y1)/2-h/2,w,h},true);

}
function boneAt(x,y){

 let g=test(x,y);if(g)return g;
 for(const r of [8,16,24])for(let a=0;a<8;a++){const t=a*Math.PI/4;g=test(x+r*Math.cos(t),y+r*Math.sin(t));if(g)return g;}

 const lab=(p,txt,col,above)=>{const wd=txt.length*fs*.56+fs*1.4,hh=fs*1.7,y=above?p[1]-r-hh-u:p[1]+r+u;
  return `<rect x="${p[0]-wd/2}" y="${y}" width="${wd}" height="${hh}" rx="${hh/2}" fill="${col}"/><text x="${p[0]}" y="${y+hh*0.72}" text-anchor="middle" font-size="${fs}" font-weight="700" fill="#fff">${txt}</text>`;};
 const dot=(p,l,col)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${r}" fill="${col}"/><text x="${p[0]}" y="${p[1]+fs*.36}" text-anchor="middle" font-size="${fs*1.1}" font-weight="700" fill="#fff">${l}</text>`;
 $('ov').innerHTML=`<line x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}" stroke="#7c3aed" stroke-width="${2.2*u}" stroke-dasharray="${5*u} ${4*u}" marker-end="url(#ar)"/>`+

function answerCase(o){
 const c=G.cur,cs=c.c;if(G.locked)return;
 const ok=o===cs.a,xp=[0,15,10,5][c.clues],m=cs.mid?M.find(x=>x.id===cs.mid):null;
 if(m)showMuscle(m);else mark(cs.bid,'ok');

/* ---------- Ricomponi lo scheletro ---------- */
function thumb(id){
 const b=bone(id),bb=gEl(id).firstElementChild.getBBox(),s=Math.max(bb.width,bb.height)+16;
 return `<svg viewBox="${bb.x+bb.width/2-s/2} ${bb.y+bb.height/2-s/2} ${s} ${s}"><g class="bone m0">${b.s}</g></svg>`;
}
function startPuzzle(){
 clearMarks();
 G.left=shuffle(B).slice(0,MOD.id==='corpo'?8:6).map(b=>b.id);G.total=G.left.length;G.sel=null;
 G.left.forEach(id=>gEl(id).classList.add('ghost'));
 puzzlePanel('Tocca (o trascina) un pezzo e portalo sul punto giusto della figura.');
}
function puzzlePanel(msg){
 $('panel').innerHTML=gh()+`<div class="fb">${msg||''}</div><div class="tray">`+G.left.map(id=>`<div class="pc${G.sel===id?' on':''}" data-id="${id}">${thumb(id)}${bone(id).n}</div>`).join('')+'</div>';
}
function placeAttempt(tid){
 if(!G.sel||G.locked)return;
 const pid=G.sel,ok=tid===pid;G.att++;touchStreak();
 if(ok){
  const g=gEl(pid);g.classList.remove('ghost');g.classList.add('ok');setTimeout(()=>g.classList.remove('ok'),700);
  G.left=G.left.filter(x=>x!==pid);G.sel=null;G.score++;G.q=G.score;G.gain+=10;S.xp+=10;S.ok++;bump(pid,1);
  save();head();refreshMastery();
  if(!G.left.length)return endGame();
  puzzlePanel(`✅ <b>${bone(pid).n}</b> – ${bone(pid).f}`);
 }else{
  const g=gEl(tid);g.classList.add('bad');setTimeout(()=>g.classList.remove('bad'),600);
  G.hearts--;S.ko++;bump(pid,-1);save();head();refreshMastery();
  if(G.hearts<=0)return endGame();
  puzzlePanel(`❌ Non è qui: quello è <b>${bone(tid).n}</b>. Riprova.`);
 }
}
let drag=null;
$('panel').addEventListener('pointerdown',e=>{
 const pc=e.target.closest('.pc');if(!pc||!G||G.mode!=='puzzle'||G.locked)return;
 drag={id:pc.dataset.id,x:e.clientX,y:e.clientY,el:null};G.sel=drag.id;
 document.querySelectorAll('.pc').forEach(p=>p.classList.toggle('on',p===pc));
 try{pc.setPointerCapture(e.pointerId);}catch(_){}
});
$('panel').addEventListener('pointermove',e=>{
 if(!drag)return;
 if(!drag.el&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8){const f=document.createElement('div');f.id='flt';f.innerHTML=thumb(drag.id);document.body.appendChild(f);drag.el=f;}
 if(drag.el){drag.el.style.left=(e.clientX-28)+'px';drag.el.style.top=(e.clientY-70)+'px';
  document.querySelectorAll('.bone.hov').forEach(x=>x.classList.remove('hov'));const hb=boneAt(e.clientX,e.clientY-42);if(hb)hb.classList.add('hov');}
});
$('panel').addEventListener('pointerup',e=>{
 if(!drag)return;const d=drag;drag=null;
 if(d.el){d.el.remove();document.querySelectorAll('.bone.hov').forEach(x=>x.classList.remove('hov'));const g=boneAt(e.clientX,e.clientY-42);if(g)placeAttempt(g.dataset.id);}
});
$('panel').addEventListener('pointercancel',()=>{if(drag&&drag.el)drag.el.remove();drag=null;});

function renderProg(){
 const mastered=B.filter(b=>(S.mastery[b.id]||0)>=3).length,tot=S.ok+S.ko;
 const rows=B.slice().sort((a,b)=>a.c[1]-b.c[1]).map(b=>{const m=S.mastery[b.id]||0;return `<div class="row" data-id="${b.id}"><span>${b.n}</span><span class="dots">${'●'.repeat(m)}<span style="color:var(--line)">${'●'.repeat(3-m)}</span></span></div>`;}).join('');
 $('panel').innerHTML=`<div class="h">${mastered}/${B.length} ossa padroneggiate</div><p class="mut">${tot?`Precisione: ${Math.round(S.ok/tot*100)}% su ${tot} risposte · Serie: ${S.streak} giorni`:'Gioca un round per iniziare a riempire i progressi.'}</p>${rows}`;
}

const ptrs=new Map();let pan=null,pinch=null,wasPan=false;
const fg=$('fig');
fg.addEventListener('pointerdown',e=>{
 if(e.target.closest('.zc,.mods'))return;
 ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});wasPan=false;
 if(ptrs.size===1)pan={x:e.clientX,y:e.clientY,vx:VB.x,vy:VB.y};
 else if(ptrs.size===2){pan=null;const [a,b]=[...ptrs.values()];pinch=Math.hypot(a.x-b.x,a.y-b.y);}
});
fg.addEventListener('pointermove',e=>{
 if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 const s=svgEl();if(!s)return;
 if(ptrs.size===2&&pinch){
  const [a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y),mid=svgPt((a.x+b.x)/2,(a.y+b.y)/2);
  wasPan=true;zoomAt(d/pinch,mid.x,mid.y);pinch=d;
 }else if(ptrs.size===1&&pan&&VB.w<MOD.W-1){
  const dx=e.clientX-pan.x,dy=e.clientY-pan.y;
  if(!wasPan&&Math.hypot(dx,dy)<7)return;
  wasPan=true;const sc=VB.w/s.getBoundingClientRect().width;
  setVB({x:pan.vx-dx*sc,y:pan.vy-dy*sc,w:VB.w,h:VB.h},false);
 }
});
const endPtr=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(!ptrs.size)pan=null;};
fg.addEventListener('pointerup',endPtr);fg.addEventListener('pointercancel',endPtr);
fg.addEventListener('wheel',e=>{if(!svgEl())return;e.preventDefault();const p=svgPt(e.clientX,e.clientY);zoomAt(e.deltaY<0?1.2:1/1.2,p.x,p.y);},{passive:false});
fg.addEventListener('click',e=>{
 const zb=e.target.closest('.zc button');
 if(zb){const k=zb.dataset.z;if(k==='reset')resetZoom(true);else zoomAt(k==='in'?1.5:1/1.5,VB.x+VB.w/2,VB.y+VB.h/2);return;}
 const mb=e.target.closest('.mods button');
 if(mb){useMod(mb.dataset.mod);return;}
 if(wasPan){wasPan=false;return;}
 const g=boneAt(e.clientX,e.clientY);if(!g)return;const id=g.dataset.id;
 if(tab==='explore')selectBone(id);
 else if(tab==='play'&&G){
  if(G.mode==='puzzle')placeAttempt(id);
  else if(G.cur&&G.cur.t==='find')answerFind(id);
  else if(G.cur&&G.cur.t==='bridge')answerBridge(id);
 }

});

{id:'l5',clues:["Dopo un ictus un paziente non vede più la metà destra del campo visivo con entrambi gli occhi.","Il deficit è visivo; movimento e sensibilità sono normali.","La lesione è nel lobo più posteriore del cervello."],a:'Lobo occipitale',opts:['Lobo occipitale','Lobo frontale','Lobo temporale','Cerebello'],bid:'occipitale',r:"È un'emianopsia omonima, tipica delle lesioni occipitali."},
{id:'l6',clues:["Paziente con cammino instabile a base larga, tremore nel raggiungere un oggetto e difficoltà nei movimenti alternati rapidi.","Il deficit è di coordinazione, non di forza.","La struttura è nella fossa cranica posteriore, dietro il tronco encefalico."],a:'Cerebello',opts:['Cerebello','Lobo frontale','Giro precentrale','Lobo parietale'],bid:'cerebello',r:"Atassia, dismetria e tremore intenzionale indicano un danno cerebellare."},
{id:'l7',clues:["Dopo un ictus emisferico destro un paziente ignora la metà sinistra dello spazio: mangia solo metà piatto.","Non è cieco: è un deficit di attenzione spaziale (eminegligenza).","La lesione è nel lobo posteriore al solco centrale."],a:'Lobo parietale',opts:['Lobo parietale','Lobo occipitale','Lobo temporale','Area di Broca'],bid:'parietale',r:"L'eminegligenza si associa tipicamente a lesioni parietali destre."},
{id:'l8',clues:["Un uomo dopo un trauma frontale diventa apatico, disinibito e non riesce a pianificare le attività quotidiane.","I deficit riguardano funzioni esecutive e comportamento.","La lesione è nella parte anteriore del cervello, davanti al solco centrale."],a:'Lobo frontale',opts:['Lobo frontale','Lobo occipitale','Cerebello','Area di Wernicke'],bid:'frontale',r:"Apatia, disinibizione e disturbi esecutivi orientano verso il lobo frontale."}
