<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BodyMania – impara l'anatomia giocando</title>
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BodyMania">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>try{const t=localStorage.getItem("bodymania-theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="stylesheet" href="css/style.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<div id="gate"><div class="gbox"><img src="icons/icon-192.png" alt="" width="72" height="72"><div class="gt">BodyMania</div><p class="mut">Impara l'anatomia giocando</p><div id="gbody"><div class="spin"></div><p class="gst">Avvio…</p></div></div></div>
<header><span id="lv"></span><div class="bar"><i id="xpb"></i></div><span id="st"></span><button id="theme" title="Sfondo scuro">🌙</button><button id="off" hidden></button></header>
<div id="fig"></div>
<div id="panel"><p class="mut">Caricamento…</p></div>
<div id="atlas" hidden></div>
<nav>
<button data-t="explore" class="on"><i>🦴</i>Esplora</button>
<button data-t="play"><i>🎮</i>Gioca</button>
<button data-t="atlas"><i>🧍</i>Atlante 3D</button>
<button data-t="prog"><i>👤</i>Profilo</button>
</nav>
</body>
</html>
